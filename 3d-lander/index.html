<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APOLLO LANDER // 3D DESCENT SIMULATOR</title>
  
  <!-- Retro & Tech Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg-darker: #050608;
      --bg-dark: #0b0e14;
      --bg-panel: rgba(18, 24, 38, 0.75);
      --border-glow: rgba(0, 240, 255, 0.2);
      
      --vector-cyan: #00f0ff;
      --vector-green: #39ff14;
      --vector-amber: #ffb700;
      --vector-red: #ff3c3c;
      --vector-pink: #ff007f;
      --vector-white: #e2e8f0;
      
      --glow-cyan: 0 0 10px rgba(0, 240, 255, 0.6), 0 0 20px rgba(0, 240, 255, 0.2);
      --glow-green: 0 0 10px rgba(57, 255, 20, 0.6), 0 0 20px rgba(57, 255, 20, 0.2);
      --glow-amber: 0 0 10px rgba(255, 183, 0, 0.6), 0 0 20px rgba(255, 183, 0, 0.2);
      --glow-red: 0 0 10px rgba(255, 60, 60, 0.6), 0 0 20px rgba(255, 60, 60, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-darker);
      background-image: 
        radial-gradient(circle at 50% 50%, #152035 0%, #050608 100%),
        linear-gradient(rgba(18, 24, 38, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 24, 38, 0.4) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      color: var(--vector-white);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 1300px;
      text-align: center;
      margin-bottom: 20px;
      padding: 15px 30px;
      background: var(--bg-panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-glow);
      border-radius: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--vector-cyan);
      text-shadow: var(--glow-cyan);
    }

    .header-stats {
      display: flex;
      gap: 20px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
    }

    .header-stats span {
      color: var(--vector-amber);
      text-shadow: var(--glow-amber);
    }

    .sidebar {
      background: var(--bg-panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-glow);
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .sidebar h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: var(--vector-cyan);
      border-bottom: 1px solid var(--border-glow);
      padding-bottom: 8px;
      margin-bottom: 10px;
      text-shadow: var(--glow-cyan);
      letter-spacing: 2px;
    }

    .info-block {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(0, 240, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .info-block h3 {
      font-size: 0.85rem;
      color: var(--vector-amber);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .key-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.85rem;
    }

    .kbd-key {
      background: #1a2233;
      border: 1px solid var(--vector-cyan);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      font-size: 0.75rem;
      box-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
      color: var(--vector-cyan);
    }

    .monitor-cabinet {
      background: #020203;
      border: 15px solid #14171f;
      border-radius: 20px;
      box-shadow: 
        0 0 0 4px #0b0e14,
        0 15px 40px rgba(0, 0, 0, 0.8),
        inset 0 0 30px rgba(0, 240, 255, 0.15);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen-wrapper {
      position: relative;
      width: 100%;
      max-width: 820px;
      aspect-ratio: 680 / 520;
      overflow: hidden;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.8);
      background-color: #020204;
    }

    /* R3F Canvas target */
    .screen-wrapper canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Realistic CRT overlays */
    .scanlines {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 4px, 6px 100%;
      z-index: 10;
    }

    .crt-glare {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(
        circle at 50% 15%, 
        rgba(255, 255, 255, 0.06) 0%, 
        rgba(255, 255, 255, 0) 70%
      );
      z-index: 11;
    }

    @keyframes crt-flicker {
      0% { opacity: 0.991; }
      50% { opacity: 1; }
      100% { opacity: 0.993; }
    }

    .crt-flicker-overlay {
      pointer-events: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 240, 255, 0.005);
      animation: crt-flicker 0.15s infinite;
      z-index: 12;
    }

    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 5, 8, 0.88);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .overlay-screen h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 1.5rem;
      margin-bottom: 25px;
      letter-spacing: 2px;
    }

    .overlay-screen .msg-primary {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--vector-white);
    }

    .overlay-screen .msg-secondary {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 30px;
      line-height: 1.6;
      max-width: 500px;
    }

    .btn-arcade {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--vector-cyan);
      background: transparent;
      border: 2px solid var(--vector-cyan);
      border-radius: 8px;
      padding: 12px 30px;
      cursor: pointer;
      outline: none;
      letter-spacing: 2px;
      text-shadow: var(--glow-cyan);
      box-shadow: 
        inset 0 0 10px rgba(0, 240, 255, 0.2),
        0 0 15px rgba(0, 240, 255, 0.1);
      transition: all 0.2s ease;
      animation: btn-glow-pulse 1.5s infinite alternate;
    }

    @keyframes btn-glow-pulse {
      from {
        box-shadow: inset 0 0 5px rgba(0, 240, 255, 0.2), 0 0 10px rgba(0, 240, 255, 0.1);
        border-color: rgba(0, 240, 255, 0.6);
      }
      to {
        box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.4), 0 0 20px rgba(0, 240, 255, 0.3);
        border-color: rgba(0, 240, 255, 1);
      }
    }

    .btn-arcade:hover {
      background: var(--vector-cyan);
      color: var(--bg-darker);
      text-shadow: none;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
    }

    .color-cyan { color: var(--vector-cyan); text-shadow: var(--glow-cyan); }
    .color-green { color: var(--vector-green); text-shadow: var(--glow-green); }
    .color-amber { color: var(--vector-amber); text-shadow: var(--glow-amber); }
    .color-red { color: var(--vector-red); text-shadow: var(--glow-red); }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .stat-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 240, 255, 0.08);
      border-radius: 6px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .stat-card .label {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--vector-white);
      white-space: nowrap;
    }

    .fuel-meter-container {
      width: 100%;
      height: 16px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
      position: relative;
    }

    .fuel-meter-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--vector-cyan), #00ffaa);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
      transition: width 0.1s linear, background 0.3s ease;
    }

    .fuel-meter-bar.low {
      background: linear-gradient(90deg, var(--vector-red), #ff5500);
      box-shadow: 0 0 8px rgba(255, 60, 60, 0.6);
      animation: fuel-blink 0.5s infinite alternate;
    }

    @keyframes fuel-blink {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 150px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .log-list::-webkit-scrollbar {
      width: 4px;
    }
    .log-list::-webkit-scrollbar-thumb {
      background: var(--border-glow);
      border-radius: 2px;
    }

    .log-item {
      font-size: 0.75rem;
      padding: 6px;
      border-left: 2px solid var(--vector-cyan);
      background: rgba(255, 255, 255, 0.02);
      border-radius: 0 4px 4px 0;
      display: flex;
      justify-content: space-between;
    }

    .audio-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 240, 255, 0.15);
      border-radius: 6px;
      transition: border-color 0.2s ease;
    }

    .audio-toggle:hover {
      border-color: var(--vector-cyan);
    }

    .audio-icon {
      font-size: 0.85rem;
      color: var(--vector-cyan);
      text-shadow: var(--glow-cyan);
      font-weight: bold;
    }

    #root {
      width: 100%;
      max-width: 1300px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>APOLLO // LANDER 3D</h1>
    <div class="header-stats">
      <div>SCORE: <span id="score-val">00000</span></div>
      <div>HI-SCORE: <span id="hiscore-val">02500</span></div>
    </div>
  </header>
  
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
